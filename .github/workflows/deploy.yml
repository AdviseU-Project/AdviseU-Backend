name: Deploy AdviseU Backend to AWS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Set up Docker Buildx for better caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Pull the latest image to use as cache
      - name: Pull latest image for caching
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: adviseu-backend
        run: |
          docker pull $ECR_REGISTRY/$ECR_REPOSITORY:latest || true

      # Build and push with caching
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/adviseu-backend:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/adviseu-backend:latest
          cache-from: |
            type=registry,ref=${{ steps.login-ecr.outputs.registry }}/adviseu-backend:latest
          cache-to: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/adviseu-backend:cache,mode=max

      - name: Deploy to ECS
        run: |
          aws ecs update-service --cluster adviseu-cluster --service adviseu-service --force-new-deployment
