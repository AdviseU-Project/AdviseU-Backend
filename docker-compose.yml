services:
  adviseu-backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${HOST_PORT}:${CONTAINER_PORT}"
    environment:
      - MONGO_URI=${MONGO_URI}
      - CONTAINER_PORT=${CONTAINER_PORT}
  test:
    # The profile makes the test service only run when explicitly requested
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - MONGO_URI=${MONGO_URI}
      - CONTAINER_PORT=${CONTAINER_PORT}
    # The "-j$(($(nproc) / 2))" flag will allow parallelism on half available threads
    command: /bin/sh -c "cd /app/build && ctest -j$(($(nproc) / 2)) -V"
