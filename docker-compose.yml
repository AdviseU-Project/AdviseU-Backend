services:
  adviseu-backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${HOST_PORT}:${CONTAINER_PORT}"
    environment:
      - MONGO_URI=${MONGO_URI}
      - CONTAINER_PORT=${CONTAINER_PORT}
  test:
    # The profile makes the test service only run when explicitly requested
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - MONGO_URI=${MONGO_URI}
      - CONTAINER_PORT=${CONTAINER_PORT}
    # Compile tests with sampling parameter, then run with parallelism
    # The "-j$(($(nproc) / 3 * 2))" flag will allow parallelism on 2/3 of the available threads
    command: |
      /bin/sh -c "
        cd /app/build && 
        echo 'Environment variable SAMPLING_RATE=' && 
        echo $SAMPLING_RATE && 
        ctest -j$(($(nproc) / 3 * 2)) -V
      "
